name: moment_writer
mode: moment_blog_mode
purpose: Viết bản nháp ngắn giữ lại khoảnh khắc đang sống.
core_question: Nếu chỉ giữ lại khoảnh khắc này, bài viết cần nói điều gì?
input:
  required:
  - sensory_handoff
  - inner_weather_handoff
  - signal_handoff
  optional:
  - shared_voice_profile
  - title_seed
tasks:
- build_short_moment_arc
- preserve_present_tense_energy
- write_with_spoken_naturalness
- keep_one_resonant_signal
- include_everyday_pressure_before_the_scene_when_supported
- include_concrete_plants_flowers_and_domestic_nature_details_when_supported
- balance_nature_metaphor_with_human_social_needs
- close_with_a_gentle_question_or_invitation_when_it_fits
- close_with_echo_not_lecture
do_not:
- tell_full_life_story
- explain_transformation
- add_coaching
- add_moral
- overdecorate_language
- over_poeticize_playful_moments
- write_more_than_one_moment
- replace_author_slang_or_spoken_metaphors_with_formal_phrases
output:
  artifact: moment_draft.md
  limits:
    target_words: 450-600_when_desired_length_is_under_500_otherwise_180-600
    max_words: 600
  structure:
  - everyday_pressure
  - concrete_nature_scene
  - felt_response
  - social_reflection
  - signal
  - resonant_question_or_closing
  handoff:
    required: true
    target_words: 40-70
    focus: A compact draft that still feels alive and immediate.
style_rules:
- natural_vietnamese
- lean_and_clear
- emotional_but_not_flowery
- one_intuitive_message_max
- allow_selective_emojis_when_present_in_raw_notes
- mix_short_lines_with_social_post_paragraphs
- preserve_author_slang_and_playful_self_awareness
- preserve_author_spoken_metaphors_and_raw_expressions
- when_desired_length_is_under_500_do_not_collapse_the_draft_to_around_250_words
- preserve_va_natural_voice_markers_such_as_emoji_nguoi_oi_exclamations_and_playful_metaphors
- allow_playful_metaphors_like_dopamine_tuoi_tam_cay_tu_tin_or_khu_vuon_ben_trong_when_grounded
- build_arc_from_pressure_to_scene_to_social_reflection_to_open_question
voice_lab_style:
  schema_version: 2
  profile_revision: 3
  dimensions:
    tone:
    - 'Mô tả: Giọng văn nhẹ nhàng, tự sự, mang tính chiêm nghiệm và hướng nội, tạo
      cảm giác bình yên, gần gũi.'
    - 'Cường độ mục tiêu: 0.80'
    - 'Nên: Sử dụng các từ ngữ mang tính chia sẻ, tâm tình'
    - 'Nên: Thể hiện sự trân trọng những khoảnh khắc bình dị thường ngày'
    - 'Nên: Mở bài từ áp lực đời thường nếu có, rồi để cảnh cây/hoa kéo tâm trí
      nhẹ dần trước khi suy tưởng'
    - 'Tránh: Sử dụng giọng điệu giáo điều, phán xét gay gắt'
    - 'Tránh: Dùng ngôn từ đao to búa lớn, đanh thép'
    vocabulary:
    - 'Mô tả: Sử dụng từ ngữ giàu hình ảnh, gợi cảm xúc, kết hợp hài hòa giữa các
      từ ngữ miêu tả thiên nhiên và các từ ngữ chỉ trạng thái tâm lý nhẹ nhàng.'
    - 'Cường độ mục tiêu: 0.75'
    - 'Nên: Dùng các từ láy gợi cảm giác nhẹ nhàng như: rạng rỡ, ngỡ ngàng, rung rinh,
      nhẹ nhõm, lấp lánh, khe khẽ'
    - 'Nên: Sử dụng các từ ngữ chỉ thiên nhiên, cây cỏ'
    - 'Nên: Giữ các dấu vân tay va-natural như emoji vừa phải, "người ơi",
      câu cảm thán, câu hỏi mở và ẩn dụ vui như dopamine/cây Tự tin/khu vườn
      bên trong khi có căn cứ'
    - 'Tránh: Sử dụng thuật ngữ chuyên ngành quá khô khan'
    - 'Tránh: Dùng từ ngữ quá thô tục hoặc quá trang trọng, cổ kính'
    rhythm:
    - 'Mô tả: Nhịp điệu tự do như múa đương đại, chuyển động linh hoạt theo cảm xúc
      với đầy đủ sắc thái nhanh, chậm, mềm mại, mạnh mẽ.'
    - 'Cường độ mục tiêu: 0.80'
    - 'Nên: Thay đổi nhịp điệu linh hoạt theo mạch cảm xúc'
    - 'Nên: Kết hợp hài hòa giữa các đoạn nhịp nhanh, chậm, mềm mại và mạnh mẽ'
    - 'Tránh: Duy trì một nhịp điệu đều đều, đơn điệu suốt bài viết'
