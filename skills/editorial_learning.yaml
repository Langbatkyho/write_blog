name: editorial_learning
version: 2.0

description: |
  Học từ khác biệt giữa đường biên tập có AI hỗ trợ và bản production
  do người viết chỉnh sửa, rồi chuyển hóa thành insight cải thiện workflow.
  Mặc định viết báo cáo bằng tiếng Việt; chỉ giữ tiếng Anh cho tên hàm,
  thuộc tính, biến số, file name, stage id, YAML key và thuật ngữ hệ thống.

input:
  workflow:
    type: yaml
    required: true
  skills:
    type: yaml_collection
    required: true
  author_input:
    type: markdown
    required: true
  step_outputs:
    type: markdown_collection
    required: true
  final_blog:
    type: markdown
    required: true
  production_blog:
    type: markdown
    required: true

goal:
  Phát hiện bản production của người viết khác gì so với output của workflow,
  rồi xác định từng stage cần học điều gì.

tasks:
  - So sánh draft_blog.md, edited_blog.md, future_reflection.md, final_blog.md và production_blog.md khi có.
  - Với moment_blog_mode, so sánh sensory_notes.md, inner_weather.md, signal_note.md, moment_draft.md, moment_edited.md, witness_report.md, final_blog.md và production_blog.md khi có.
  - Nhận diện các preference biên tập lặp lại của người viết.
  - Tách chỉnh sửa một lần khỏi nguyên tắc workflow có thể tái sử dụng.
  - Truy ngược thay đổi trong production về stage chịu trách nhiệm nhiều nhất.
  - Đánh giá từng stage theo đúng mode hiện tại, không áp deep agents vào moment mode.
  - Gợi ý cải thiện cụ thể cho các stage hiện có trong workflow.

rules:
  - Mặc định viết toàn bộ output bằng tiếng Việt.
  - Chỉ giữ tiếng Anh cho tên hàm, thuộc tính, biến số, file name, stage id, YAML key và thuật ngữ hệ thống đã có sẵn.
  - Không viết lại bài blog.
  - Không tâng bốc người viết.
  - Không xem mọi chỉnh sửa của người viết là một quy tắc.
  - Ưu tiên insight workflow chính xác hơn lời khuyên viết lách chung chung.
  - Giữ sự chưa chắc khi evidence chưa đủ mạnh.

output:
  type: markdown
  name: editorial_learning_report.md
  sections:
    - executive_summary
    - major_differences
    - author_editorial_preferences
    - draft_to_edit_learning
    - edit_to_production_learning
    - stage_by_stage_insights
    - suggested_skill_yaml_changes
    - future_prompting_notes
    - open_questions_for_author
